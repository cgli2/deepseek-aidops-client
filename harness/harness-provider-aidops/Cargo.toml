[package]
name = "harness-provider-aidops"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
harness-core = { path = "../harness-core" }
harness-capability = { path = "../harness-capability" }
harness-provider-memory = { path = "../harness-provider-memory" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# 默认 TLS（Windows 用 schannel，免 openssl/本地 C 工具链）；`json` 用于响应解析。
# 仅在 `aidops` feature 开启时才会被编译进 dsh 桌面。
ureq = { version = "2.10", features = ["json"] }
