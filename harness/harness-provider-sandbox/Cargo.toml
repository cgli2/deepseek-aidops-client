[package]
name = "harness-provider-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
harness-core = { path = "../harness-core" }
async-trait = { workspace = true }
tokio = { workspace = true }

# 平台隔离原语：仅对应目标编译（原 §9 / §16）。macOS 仍用 NullSandbox 占位。
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.3"
seccompiler = "0.3"
nix = { version = "0.29", features = ["sched", "mount"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
